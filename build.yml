name: Build VST3 (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target PaletteMelody_VST3
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PaletteMelody-VST3
          path: build/PaletteMelody_artefacts/Release/VST3/
